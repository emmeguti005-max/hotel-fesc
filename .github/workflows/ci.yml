name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, intl

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist

      - name: Copiar .env de pruebas
        run: cp .env.example .env

      - name: Generar APP_KEY
        run: php artisan key:generate

      - name: Estilo de codigo (Pint)
        run: vendor/bin/pint --test

      - name: Analisis estatico (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Pruebas (phpunit.xml ya usa SQLite en memoria)
        run: php artisan test
